# Generated with help from AI
# SonarQube server settings
sonar.host.url=http://localhost:9000
sonar.token=<token>

# Project identification
sonar.projectKey=econ
sonar.projectName=econ
sonar.projectVersion=1.0

# Analysis settings
# Include frontend and backend source directories
sonar.sources=client,controllers,routes,models,helpers,middlewares,config

# Import coverage from all jest runs (separate directories)
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info,coverage/frontend-integration/lcov.info,coverage/backend/lcov.info,coverage/backend-integration/lcov.info

sonar.language=js

# sonar.inclusions=**/*.js

# Mark test files so Sonar doesn't treat them as source
sonar.test.inclusions=**/*.test.js,**/*.spec.js,**/*.integration.test.js

# Ensure tests are excluded from coverage metrics even if picked up
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/*.integration.test.js

# Extra safety: ignore dependencies
sonar.exclusions=**/node_modules/**
